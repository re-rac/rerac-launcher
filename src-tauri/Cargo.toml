[package]
name = "rerac-launcher"
version = "0.2.1"
description = "Launcher for ReRAC: installs game data from your own disc image and starts the game"
authors = ["ReRAC contributors"]
license = "ISC"
edition = "2021"
rust-version = "1.77"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "rerac_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Official releases (GitHub releases API). rustls so no system OpenSSL is needed on Linux.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Unpacking build zips (install.rs). Deflate only, through flate2 + zlib-rs (both already in the
# tree); no encryption, bzip2, lzma or zstd.
zip = { version = "4.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
